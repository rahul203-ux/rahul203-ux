name: Generate GitHub Statistics

on:
  # Run automatically once every day
  schedule:
    - cron: "0 0 * * *"

  # Allow you to run it manually
  workflow_dispatch:

  # Run whenever generate_stats.py changes
  push:
    paths:
      - "generate_stats.py"

permissions:
  contents: write

jobs:
  generate-stats:

    runs-on: ubuntu-latest

    steps:

      # 1. Download your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Install required package
      - name: Install dependencies
        run: |
          pip install requests

      # 4. Generate the SVG statistics
      - name: Generate GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_stats.py

      # 5. Save the generated SVG to your repository
      - name: Commit generated statistics
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats/github-stats.svg

          git diff --cached --quiet || \
            git commit -m "Update GitHub statistics"

          git push
